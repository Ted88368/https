<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTTPS IP Service</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f6f8fa;
        color: #17202a;
      }
      main {
        width: min(680px, calc(100vw - 32px));
      }
      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.2;
      }
      p {
        margin: 0;
        line-height: 1.65;
        color: #52606d;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #111418;
          color: #edf2f7;
        }
        p {
          color: #a9b4c0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HTTPS 服务已启动</h1>
      <p>当前容器会通过 HTTP-01 校验申请 Let's Encrypt IP 地址证书，并自动续签后重载 Nginx。</p>
    </main>
  </body>
</html>
