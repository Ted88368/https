services:
  https-ip:
    build: .
    container_name: https-ip
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      MODE: ${MODE:-letsencrypt}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      DOMAINS: ${DOMAINS:-}
      SERVER_NAME: ${SERVER_NAME:-_}
      SIGN_IP: ${SIGN_IP:-auto}
      ACME_EMAIL: ${ACME_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-1}
      RENEW_INTERVAL_SECONDS: ${RENEW_INTERVAL_SECONDS:-21600}
      PREFERRED_PROFILE: ${PREFERRED_PROFILE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - nginx-certs:/etc/nginx/certs
      - ./public/downloads:/usr/share/nginx/html/downloads
      - ./locations.d:/etc/nginx/conf.d/locations:ro

volumes:
  letsencrypt:
  nginx-certs:
